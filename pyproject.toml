[project]
name = "agemem"
version = "0.1.0"
description = "Agentic Memory (AgeMem) MCP Server"
requires-python = ">=3.13"
authors = [{ name = "Abdelwahab" }]
dependencies = [
    "mcp[cli]",
    "weaviate-client>=4.10.0",
    "langchain",
    "langchain-google-genai",
    "pydantic-settings",
    "python-dotenv",
    "langchain-core>=1.2.7",
    "pytest>=9.0.2",
    "pytest-asyncio>=1.3.0",
    "zstandard>=0.25.0",
    "jsonpatch>=1.33",
    "xxhash>=3.6.0",
    "pylint>=4.0.4",
    "weaviate>=0.1.2",
]

[tool.setuptools.packages.find]
where = ["src"]
include = ["*"]

[tool.pytest.ini_options]
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::UserWarning",
]
